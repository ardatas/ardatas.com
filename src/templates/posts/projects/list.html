<div class="flex flex-col gap-3">
  {% for post in posts %}
    <a
      href="{{ post.href }}"
      {% if post.external %}target="_blank" rel="noopener noreferrer"{% endif %}
      class="group block bg-white border border-[#b7b5ae] p-3 transition-[border-color,transform] hover:border-[#315f87] hover:-translate-y-px focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#315f87]"
    >
      <div class="grid grid-cols-[48px_1fr] sm:grid-cols-[48px_1fr_auto] gap-3 items-center">
        <div class="h-12 w-12 overflow-hidden border border-neutral-200 bg-white p-1">
          <img
            class="h-full w-full object-contain"
            src="{{ post.coverImage }}"
            alt="{{ post.title }} logo"
            loading="eager"
          />
        </div>
        <div class="min-w-0">
          <div class="font-semibold text-base mb-1 leading-5 tracking-tight">{{ post.title }}</div>
          <p class="text-sm leading-5 text-neutral-700 dark:text-neutral-300">{{ post.summary }}</p>
        </div>
        <span class="col-start-2 justify-self-start sm:col-start-auto sm:justify-self-end border border-black px-3 py-1 font-mono text-[11px] group-hover:bg-[#315f87] group-hover:text-white group-hover:border-[#315f87]">Visit ↗</span>
      </div>
    </a>
  {% endfor %}
</div>
