{% macro button(href, class) %}

    href="{{ href }}"
    class="flex flex-row items-center justify-center gap-1.5 rounded-none border border-black bg-white hover:bg-[#315f87] hover:border-[#315f87] hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#315f87] font-mono text-[11px] font-medium px-3 h-8 shadow-[2px_2px_0_0_rgba(16,17,20,0.35)] {{ class }}"
  >
    {{ caller() }}
  </a>
{% endmacro %}
