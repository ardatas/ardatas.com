{% macro fieldset(title) %}
  <fieldset
    class="border-t md:border border-solid border-[#8f8d86] min-w-0 p-1 md:p-4 pt-2"
  >
    <legend class="ms-4 md:ms-0">
      <h6 class="text-sm mx-2 font-mono italic tracking-tight bg-[#f6f4ee] px-1">{{ title }}</h6>
    </legend>
    {{ caller() }}
  </fieldset>
{% endmacro %}
